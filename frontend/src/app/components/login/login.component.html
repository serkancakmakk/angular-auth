<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-4">
            <div class="card">
                <div class="card-body">
                    <div class="col-12">
                        <div class="mb-3">
                            <label for="username">Kullanıcı Adı :</label>
                            <input type="text" class="form-control mb-2" id="username" [(ngModel)]="username" name="username" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="mb-3">
                            <label for="password">Şifre :</label>
                            <input type="password" class="form-control mb-2" id="password" [(ngModel)]="password" name="password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" (click)="onLogin()">Giriş</button>
                </div>
            </div>
        </div>
    </div>
</div>
